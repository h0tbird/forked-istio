apiVersion: release-notes/v2
kind: bug-fix
area: traffic-management

issue:
  - 60033

releaseNotes:
  - |
    **Fixed** a memory and goroutine leak in `istiod` when a multicluster remote secret is
    updated. Every update rebuilds the remote cluster, but the rebuild leaked the previous
    cluster's collections, event handlers and informer caches, so frequent service account
    token rotation grew `istiod` memory without bound.
